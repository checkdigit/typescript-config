name: CI

on:
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  pullRequestBuild:
    name: Pull Request Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['26.x', '27.0.0-alpha.0.0.0']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Use latest npm
        run: npm install --global npm@latest
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Compile
        run: npm run ci:compile
      - name: Check Code Style
        run: npm run ci:style
      - name: Perform Linting
        run: npm run ci:lint
      - name: Run Tests
        run: npm run ci:test

  branchBuild:
    name: Branch Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['26.x', '27.0.0-alpha.0.0.0']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Use latest npm
        run: npm install --global npm@latest
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Compile
        run: npm run ci:compile
      - name: Check Code Style
        run: npm run ci:style
      - name: Perform Linting
        run: npm run ci:lint
      - name: Run Tests
        run: npm run ci:test

  dependencyReview:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Review dependencies
        uses: actions/dependency-review-action@v5
        with:
          allow-licenses: ${{ vars.ALLOW_LICENSES }}

  result:
    name: CI
    needs: [pullRequestBuild, branchBuild, dependencyReview]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful build and dependency review jobs
        if: >-
          needs.pullRequestBuild.result != 'success' ||
          needs.branchBuild.result != 'success' ||
          needs.dependencyReview.result != 'success'
        run: exit 1
