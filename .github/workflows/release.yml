name: Release

on:
  pull_request_target:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: read
    concurrency:
      group: release-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      # No PR checkout: the action reads the merged commit and tags it through the API.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
      - name: Use latest npm
        run: npm install --global npm@latest
      - name: Tag and release
        id: release
        uses: checkdigit/github-actions/release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dispatch release publishing
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run publish.yml --ref "$DEFAULT_BRANCH" -f "tag=$RELEASE_TAG"
