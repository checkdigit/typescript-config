name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, v11.0.0)
        required: true
        type: string
  pull_request:
    branches:
      - 'main'

jobs:
  publish:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Publish Release' || 'Publish Beta' }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || format('refs/tags/{0}', inputs.tag) }}
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          allow-licenses: ${{ vars.ALLOW_LICENSES }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - name: Use latest npm
        run: npm install --global npm@latest
      - name: Check Label
        if: github.event_name == 'pull_request'
        uses: checkdigit/github-actions/check-label@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Imports
        if: github.event_name == 'pull_request'
        uses: checkdigit/github-actions/check-imports@main
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Audit Signatures
        run: npm audit signatures
      - name: Run Test
        if: github.event_name == 'pull_request'
        run: npm run ci:test
      - name: Prepare Beta
        if: github.event_name == 'pull_request'
        id: prepare-beta
        uses: checkdigit/github-actions/prepare-beta@main
      - name: Publish Release
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --access public
      - name: Publish Beta
        if: github.event_name == 'pull_request'
        run: npm publish --tag beta --access public
      - name: Validate Published Beta NPM Package
        if: github.event_name == 'pull_request'
        uses: checkdigit/github-actions/validate-npm-package@main
        with:
          betaPackage: ${{ steps.prepare-beta.outputs.betaPackage }}
        env:
          # The action writes an npmrc containing this variable; public downloads need no token.
          NPM_TOKEN: ''
      - name: Comment npm publish result
        if: github.event_name == 'pull_request'
        uses: checkdigit/github-actions/comment-npm-publish@main
        with:
          betaPackage: ${{ steps.prepare-beta.outputs.betaPackage }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
